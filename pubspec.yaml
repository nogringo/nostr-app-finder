version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  bech32: ^0.2.2
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
